[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Static assets are content-hashed by the build; the HTML is not.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Stage 4 (spec §5.4): the redirect map for Podia URLs already in circulation
# goes here. Nothing is redirected yet — the apex still points at Podia.
